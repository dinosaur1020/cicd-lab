name: Run Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # act copies the host workspace (including Mac node_modules) into the Linux job container.
      # Removing node_modules before npm ci ensures optional native packages (e.g. Vitest/rolldown) match Linux.
      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Run tests
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      # upload-artifact needs ACTIONS_RUNTIME_TOKEN (GitHub runner only); `act` sets ACT=true locally.
      - name: Upload test report artifact
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: reports/
          if-no-files-found: error
